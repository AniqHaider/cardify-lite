<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo storefront · Cardify</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; color: #111; }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 1.5rem; }
    p.hint { color: #555; max-width: 60ch; }
    ul { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 20px;
         grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    /* The "native" card this fake store renders. Cardify hides it, never removes it. */
    .native { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; overflow: hidden; }
    .native a { color: inherit; text-decoration: none; display: block; }
    .native img { width: 100%; aspect-ratio: 4/5; object-fit: cover; display: block; background: #ddd; }
    .native .body { padding: 12px; }
    .native .price { color: #555; margin-top: 4px; }
    .native button { margin: 0 12px 12px; padding: 8px 12px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Demo storefront</h1>
    <p class="hint">
      These are this fake store's own product cards. Open the Cardify admin
      (localhost:5173, merchant <code>demostore</code>), switch Cardify on, pick a design,
      then come back to this tab: the cards change with no reload.
    </p>
    <ul id="grid"></ul>
  </main>

  <script>
    // Sample products. In a real store these come from your own data.
    const products = [
      ["Sunny Day Frock", "₹1,299", "₹1,999", "35% off", "New"],
      ["Cloud Hoodie", "₹1,499", "₹1,799", "17% off", ""],
      ["Trail Joggers", "₹999", "", "", "Bestseller"],
      ["Rainbow Tee", "₹599", "₹799", "25% off", ""],
      ["Denim Overalls", "₹1,899", "", "", "New"],
      ["Linen Shirt", "₹1,199", "₹1,599", "25% off", ""],
    ];
    const art = (hue, label) =>
      "data:image/svg+xml;utf8," + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="480" height="600"><rect width="480" height="600" fill="hsl(${hue},65%,72%)"/><text x="240" y="310" font-family="sans-serif" font-size="30" fill="white" text-anchor="middle">${label}</text></svg>`);

    document.getElementById("grid").innerHTML = products.map(([title, price, compare, discount, badge], i) => {
      const data = {
        title, href: "#product-" + i, image: art(i * 55, "Front"), imageHover: art(i * 55 + 30, "Back"),
        price, compareAtPrice: compare || undefined, discountLabel: discount || undefined,
        badge: badge || undefined, vendor: "Acme Kids", rating: 4.5, ratingMax: 5, ratingCount: 40 + i * 17,
        quickBuy: true, quickBuyLabel: "Quick buy",
      };
      // The host contract: data-cardify-card + data-cardify-product on the cell,
      // data-cardify-link / data-cardify-quickbuy on the native controls.
      return `<li class="native" data-cardify-card data-cardify-product='${JSON.stringify(data).replace(/'/g, "&#39;")}'>
        <a data-cardify-link href="#product-${i}">
          <img src="${data.image}" alt="${title}" />
          <div class="body"><div>${title}</div><div class="price">${price}</div></div>
        </a>
        <button data-cardify-quickbuy type="button" onclick="alert('The store\\'s own quick-buy ran: ${title}')">Quick buy</button>
      </li>`;
    }).join("");
  </script>
  <script src="http://localhost:4100/cardify/sdk/cardify-loader.js?store=demostore"></script>
</body>
</html>
